name: zuoge-crypto-strategy
version: 1.0.0
description: >
  编写、校验、回测并自动投递实时策略候选到生产收件箱；生产审批和启用由人工完成。
project_root_env: ZUOGE_CRYPTO_PROJECT_ROOT
project_root_detection:
  required_files:
    - cmd/crypto-skill/main.go
    - strategy/runtime/strategy_sdk.py

runtime_query_env:
  - ZUOGE_CRYPTO_BASE_URL
  - ZUOGE_CRYPTO_API_KEY

agent_api_runtime_queries:
  prefix: /api/v1/agent
  auth_header: "Authorization: Bearer ${ZUOGE_CRYPTO_API_KEY}"

allowed_write_paths:
  - ${PROJECT_ROOT}/strategy/strategies/candidates/
  - ${PROJECT_ROOT}/strategy/reports/
  - ${PROJECT_ROOT}/research/
  - ${PROJECT_ROOT}/tmp/ai-skill/

readonly_paths:
  - ${SKILL_ROOT}/generated/
  - ${SKILL_ROOT}/references/
  - ${PROJECT_ROOT}/pkg/contracts/
  - ${PROJECT_ROOT}/docs/

forbidden_paths:
  - ${PROJECT_ROOT}/.env
  - ${PROJECT_ROOT}/strategy/strategies/enabled/
  - ${PROJECT_ROOT}/internal/risk/
  - ${PROJECT_ROOT}/internal/execution/
  - ${PROJECT_ROOT}/internal/exchange/
  - ${PROJECT_ROOT}/secrets/
  - ${PROJECT_ROOT}/keys/

allowed_commands:
  - crypto-skill capabilities show
  - crypto-skill capabilities export
  - crypto-skill research create
  - crypto-skill research show
  - crypto-skill candidate new
  - crypto-skill candidate list
  - crypto-skill candidate show
  - crypto-skill candidate check
  - crypto-skill candidate test
  - crypto-skill candidate backtest
  - crypto-skill candidate report
  - crypto-skill candidate export
  - crypto-skill candidate publish
  - crypto-skill strategy deploy-current

forbidden_commands:
  - crypto-skill candidate promote-enabled
  - crypto-skill candidate submit-review
  - psql
  - curl non-agent routes
  - any exchange order command
