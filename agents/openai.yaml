interface:
  display_name: "Zuoge 加密货币策略"
  short_description: "编写、校验、回测并投递实时策略候选到生产收件箱"
  default_prompt: "使用 $zuoge-crypto-strategy 编写、校验、回测、生成报告并投递实时策略候选。先从当前工作区或 ZUOGE_CRYPTO_PROJECT_ROOT 确认 crypto-trader 项目根目录。候选策略登记、检查、测试、回测和报告通过 crypto-skill 操作本地源码目录和本地开发数据库；本地候选操作不要求 API 服务启动，如果当前 shell 没有 DATABASE_URL，crypto-skill 会读取 .env.dev，且默认只允许连接库名以 _dev 结尾的开发库。只有查询运行态能力目录、实时 context、订阅状态或决策日志时，才使用 Authorization: Bearer 调用 /api/v1/agent/...。只把候选策略写入 strategy/strategies/candidates/，使用 runtime.strategy_sdk，实现 discover(universe) 和 build_signals_from_context(context)，预热前只输出候选，完整上下文预热后才输出标准 StrategySignalEvent，并记录 SIGNAL、NO_TRADE、WAIT_WARMUP、DEGRADED_SKIP、VALIDATION_FAILED 等决策日志。涉及组装、解释或校验 StrategySignalEvent/trade_params 时，先读取 references/trade-plan-signal-parameter-design.md，并可用 generated/trade-plan-signal.schema.json 核对字段合同。依次运行 crypto-skill candidate check/test/backtest/report，全部通过后运行 crypto-skill candidate publish --candidate <candidate_id> 投递到生产 Strategy Center 收件箱，然后停止等待人工审批。用户明确要求发布当前策略运行时代码时，只需确认项目根目录和 crypto-skill 可用，然后执行 crypto-skill strategy deploy-current；发布当前策略目录不携带或覆盖生产 enabled 状态。不要写 enabled 策略目录，不要 submit-review、审批候选、启用候选、禁用策略、使用网页控制台 cookie、读取密钥、发布 strategy.signals，或调用风控、执行、交易所接口。"

policy:
  allow_implicit_invocation: true
